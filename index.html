<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f2ea">
<meta name="description" content="Štempl – digitální věrnostní karta v mobilu a víc recenzí na Googlu pro kavárny, bistra a salony.">
<title>Štempl</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Štempl">
<style>
/* System fonts only: nothing is downloaded from font services, so no visitor data goes to third parties */
/* Look: ink on warm paper, one stamp-red brand colour used sparingly; the business accent colours each card and its stamps */
:root{
  --paper:#f5f2ea; --card:#fffefb; --ink:#16140f; --ink2:#221f19; --muted:#655f55; --line:rgba(22,20,15,.1); --line2:rgba(22,20,15,.16);
  --brand:#d9480f; --brand-ink:#b33a08; --ok:#256f45; --warn:#9a4a07; --bad:#b42318; --accent:var(--brand);
  --cream:#f5f2ea; --cream2:#cfc8ba;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable Display","Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sh1:0 1px 2px rgba(22,20,15,.05),0 8px 24px -12px rgba(22,20,15,.14);
  --sh2:0 1px 2px rgba(22,20,15,.06),0 28px 60px -30px rgba(40,28,12,.4);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.6 var(--body);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-.032em;margin:0;text-wrap:balance;line-height:1.06}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:8px}
.wrap{max-width:1140px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.narrow{max-width:540px}
.mid{max-width:760px}
.eyebrow{font:600 .72rem/1.3 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.9rem} .tiny{font-size:.8rem}
.mono{font-family:var(--mono);letter-spacing:.06em;overflow-wrap:anywhere}
[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:20;background:rgba(245,242,234,.86);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:11px}
.logo{display:inline-flex;align-items:center;gap:9px;text-decoration:none;font:700 1.22rem/1 var(--display);letter-spacing:-.035em;min-height:44px}
.logo svg{width:26px;height:26px}
.toplinks{display:flex;gap:6px;font-size:.93rem;align-items:center}
.toplinks a{white-space:nowrap;text-decoration:none;color:var(--muted);padding:10px 12px;border-radius:10px;font-weight:500;transition:color .2s,background .2s}
.toplinks a:hover{color:var(--ink);background:rgba(22,20,15,.05)}
.toplinks a.cta{color:var(--cream);background:var(--ink);padding:10px 16px;font-weight:600;margin-left:6px}
.toplinks a.cta:hover{background:#000;color:#fff}
@media (max-width:820px){.toplinks a:not(.cta):not(.keep){display:none}}
@media (max-width:420px){.toplinks a{padding:10px 8px}.toplinks a.cta{padding:10px 12px;margin-left:2px}.logo{font-size:1.12rem;gap:7px}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:13px;border:1.5px solid var(--line2);background:var(--card);font-weight:600;text-decoration:none;cursor:pointer;transition:transform .18s cubic-bezier(.2,.7,.2,1),background .2s,color .2s,border-color .2s,box-shadow .2s;text-align:center}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--cream);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 10px 22px -14px rgba(22,20,15,.7)}
.btn.primary:hover{background:#000;transform:translateY(-1px)}
.btn.light{background:var(--cream);border-color:var(--cream);color:var(--ink)}
.btn.light:hover{background:#fff;border-color:#fff;transform:translateY(-1px)}
.btn.onink{background:transparent;border-color:rgba(245,242,234,.32);color:var(--cream)}
.btn.onink:hover{border-color:var(--cream)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--on-accent,#fff);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.btn.ghost{background:transparent;border-color:var(--line2)}
.btn.danger{background:transparent;border-color:rgba(180,35,24,.35);color:var(--bad)}
.btn.big{min-height:62px;font-size:1.12rem;border-radius:16px;width:100%}
.btn.sm{min-height:40px;padding:0 13px;font-size:.88rem;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;font-size:.9rem;font-weight:600}
.field small{font-weight:400;color:var(--muted)}
.input{width:100%;min-height:50px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line2);background:var(--card);font-size:1rem;transition:border-color .2s,box-shadow .2s}
.input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 4px rgba(22,20,15,.08)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;color:var(--muted)}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--ink);flex:none}
.form{display:grid;gap:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.msg{min-height:1.3em;font-size:.92rem;font-weight:500}
.msg.err{color:var(--bad)} .msg.ok{color:var(--ok)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--sh1)}
.stack{display:grid;gap:18px} .stack>*{min-width:0}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.note{padding:14px 16px;border-radius:14px;font-size:.93rem;background:rgba(154,74,7,.1);color:#70340a}
.note.bad{background:rgba(180,35,24,.09);color:var(--bad)}
.note.ok{background:rgba(37,111,69,.11);color:#1c5433}
.note.demo{background:var(--ink);color:var(--cream)}
.note b{color:inherit}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--ink);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loadbox{display:flex;align-items:center;gap:14px;padding-block:44px}
/* stamps */
.stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stamps.n5,.stamps.n10,.stamps.n15,.stamps.n20,.stamps.n25,.stamps.n30{grid-template-columns:repeat(5,1fr)}
.slot{aspect-ratio:1;width:100%;display:block;color:var(--ink)}
.slot .num{font:600 22px/1 var(--body);fill:var(--muted)}
.slot.new g{animation:thump .55s cubic-bezier(.2,1.6,.4,1) both;transform-origin:50px 50px}
@keyframes thump{0%{transform:scale(1.9);opacity:0}60%{opacity:1}100%{transform:scale(1);opacity:1}}
/* loyalty card */
.lcard{position:relative;display:block;background:linear-gradient(180deg,#fffefb,#fbf8f1);border-radius:24px;padding:26px 22px 22px;border:1px solid var(--line);box-shadow:var(--sh2);overflow:hidden}
.lcard::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--accent)}
.lcard .eyebrow{display:flex;justify-content:space-between;gap:10px}
.lcard .biz{font:700 1.65rem/1.08 var(--display);letter-spacing:-.03em;margin-top:8px}
.lcard .rw{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:8px 0 18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.lcard .rw b{color:var(--accent-ink,var(--accent))}
.ready{margin-top:16px;padding:14px 16px;border-radius:14px;background:var(--accent);color:var(--on-accent,#fff);font-weight:600;display:flex;gap:10px;align-items:center}
.qrbig{margin-top:18px;padding-top:18px;border-top:1px dashed var(--line2);display:grid;justify-items:center;gap:10px;text-align:center}
.qr{background:#fff;border-radius:14px;padding:8px;border:1px solid var(--line)}
.qr svg{width:100%;height:100%;display:block}
.qrbig .qr{width:min(220px,70vw);aspect-ratio:1}
.code{font:600 1.15rem/1 var(--mono);letter-spacing:.14em}
/* sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;max-height:88vh;overflow:auto;padding:24px max(18px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));background:var(--card);border-radius:26px 26px 0 0;box-shadow:0 -20px 60px rgba(0,0,0,.2);transform:translateY(110%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none;visibility:visible}
.sheet:not(.on){visibility:hidden;transition:transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s .45s}
.sheet .inner{max-width:540px;margin:0 auto;display:grid;gap:14px}
.scrim{position:fixed;inset:0;z-index:39;background:rgba(22,20,15,.42);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
/* cookie notice */
.cbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;max-width:580px;margin:0 auto;background:var(--ink);color:var(--cream);border-radius:16px;padding:14px 16px;display:flex;gap:14px;align-items:center;font-size:.86rem;box-shadow:0 20px 50px -20px rgba(0,0,0,.55)}
body.hasbar{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.cbar a{color:#fff} .cbar .btn{min-height:40px;background:transparent;border-color:rgba(245,242,234,.5);color:var(--cream);flex:none}
/* landing */
.hero{margin-top:18px;border-radius:32px;background:radial-gradient(120% 90% at 88% 18%,rgba(217,72,15,.34),rgba(217,72,15,0) 58%),var(--ink);color:var(--cream);padding:clamp(28px,5.5vw,72px);display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(28px,5vw,64px);align-items:center;overflow:hidden}
.hero .eyebrow{color:var(--cream2)}
.hero h1{font-size:clamp(2.5rem,6.4vw,4.9rem);letter-spacing:-.04em;line-height:1}
.hero h1 em{font-style:normal;color:#ff8a4c}
.hero .lede{font-size:1.14rem;color:var(--cream2);max-width:33rem;margin:22px 0 30px}
.hero .fine{color:var(--cream2);font-size:.88rem;margin-top:14px}
.trust{list-style:none;margin:30px 0 0;padding:22px 0 0;border-top:1px solid rgba(245,242,234,.16);display:flex;flex-wrap:wrap;gap:10px 26px;font-size:.92rem;color:var(--cream2)}
.trust li{display:flex;gap:8px;align-items:center}
.trust svg{width:18px;height:18px;color:#ff8a4c;flex:none}
.phone{justify-self:center;width:min(320px,100%);aspect-ratio:9/18.2;border-radius:46px;background:#0b0a08;padding:11px;border:1px solid rgba(245,242,234,.18);box-shadow:0 50px 90px -40px rgba(0,0,0,.9),0 0 0 6px rgba(245,242,234,.04)}
.phone .screen{height:100%;border-radius:36px;background:var(--paper);color:var(--ink);padding:30px 13px 14px;overflow:hidden;display:flex;flex-direction:column;gap:12px}
.phone .lcard{padding:20px 16px 16px;border-radius:20px;box-shadow:var(--sh1)}
.phone .lcard .biz{font-size:1.3rem}
@media (max-width:880px){.hero{grid-template-columns:1fr;border-radius:26px}.phone{width:min(290px,84%)}}
.section{padding-block:clamp(64px,9vw,104px)}
.section.alt{background:#efeadf;border-block:1px solid var(--line)}
.shead{max-width:700px;margin-bottom:38px;display:grid;gap:14px}
.shead h2{font-size:clamp(2rem,4.4vw,3.2rem)}
.shead p{color:var(--muted);font-size:1.08rem}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.step{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:var(--sh1)}
.step .n{font:600 .8rem/1 var(--mono);letter-spacing:.1em;color:var(--brand-ink);display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--brand)}
.step h3{font-size:1.28rem;margin:18px 0 8px;letter-spacing:-.02em}
.step p{color:var(--muted)}
@media (max-width:880px){.steps{grid-template-columns:1fr}}
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.feat{background:var(--card);padding:26px;display:grid;gap:10px;align-content:start}
.feat svg{width:26px;height:26px;color:var(--brand)}
.feat h3{font-size:1.1rem;letter-spacing:-.015em;line-height:1.25}
.feat p{color:var(--muted);font-size:.95rem}
.rules{background:var(--ink);color:var(--cream);border-radius:22px;padding:26px;display:grid;gap:8px}
.rules p{color:var(--cream2)}
.split{display:grid;grid-template-columns:.85fr 1.15fr;gap:clamp(24px,5vw,56px);align-items:center}
@media (max-width:880px){.split{grid-template-columns:1fr}}
.bframe{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh2);overflow:hidden}
.bframe .bar{display:flex;align-items:center;gap:6px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:.8rem;color:var(--muted)}
.bframe .bar i{width:9px;height:9px;border-radius:50%;background:var(--line2)}
.bframe .bar span{margin-left:8px}
.bframe .in{padding:18px;display:grid;gap:14px}
.versus{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:700px){.versus{grid-template-columns:1fr}}
.versus>div{border-radius:20px;padding:26px;border:1px solid var(--line);background:var(--card)}
.versus>div.win{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.versus h3{font-size:1.25rem;margin-bottom:16px}
.versus ul{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.versus li{display:flex;gap:10px;align-items:flex-start;color:var(--muted)}
.versus .win li{color:var(--cream2)}
.versus li svg{width:18px;height:18px;flex:none;margin-top:3px}
.versus .win li svg{color:#ff8a4c}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:700px){.plans{grid-template-columns:1fr}}
.plan{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px;display:grid;gap:10px;align-content:start;box-shadow:var(--sh1)}
.plan.hi{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.plan.hi .eyebrow,.plan.hi .muted{color:var(--cream2)}
.plan .big{font:700 clamp(2.5rem,6.5vw,3.5rem)/1 var(--display);letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.plan .badge{justify-self:start;font-size:.76rem;font-weight:600;padding:4px 10px;border-radius:999px;background:#ff8a4c;color:#16140f}
.plan .btn{margin-top:8px}
.ticks{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.ticks li{display:flex;gap:10px}
.ticks li::before{content:"";width:18px;height:18px;flex:none;margin-top:4px;border-radius:50%;border:2.5px solid var(--brand)}
.faq{display:grid;gap:10px;max-width:820px}
.faq details{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 20px}
.faq summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:14px;min-height:60px;font-weight:600;font-size:1.03rem}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font:400 1.5rem/1 var(--body);color:var(--muted);transition:transform .25s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{color:var(--muted);padding:0 0 20px;max-width:64ch}
.band{border-radius:28px;background:radial-gradient(90% 120% at 10% 100%,rgba(217,72,15,.3),rgba(217,72,15,0) 60%),var(--ink);color:var(--cream);padding:clamp(28px,5vw,56px);display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,56px);align-items:start}
@media (max-width:880px){.band{grid-template-columns:1fr}}
.band h2{font-size:clamp(1.9rem,4vw,2.8rem)}
.band p{color:var(--cream2)}
.band .panel{color:var(--ink)}
footer.foot{padding-block:30px;border-top:1px solid var(--line);color:var(--muted);font-size:.88rem;margin-top:48px}
footer.foot .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer.foot a{color:var(--muted)}
/* staff */
.scan{position:relative;border-radius:22px;overflow:hidden;background:#000;aspect-ratio:1;max-height:62vh;width:100%}
.scan video{width:100%;height:100%;object-fit:cover;display:block}
.scan .frame{position:absolute;inset:18%;background:none;border:3px solid rgba(255,255,255,.9);border-radius:22px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.scan .hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:#fff;font-weight:600;font-size:.92rem}
.howscan{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.howscan svg{width:60px;height:60px;color:var(--brand)}
.result{border-radius:22px;padding:22px;background:var(--card);border:2px solid var(--accent);box-shadow:var(--sh1)}
.done{display:grid;place-items:center;gap:8px;text-align:center;padding:30px;border-radius:22px;background:var(--ok);color:#fff}
.done svg{width:72px;height:72px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv div{background:rgba(22,20,15,.045);border-radius:12px;padding:11px}
.kv b{display:block;font:700 1.5rem/1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kv span{font-size:.78rem;color:var(--muted)}
/* dashboard */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--sh1)}
.tile b{display:block;font:700 2.2rem/1 var(--display);letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin-bottom:6px}
.tile span{font-size:.86rem;color:var(--muted);line-height:1.35;display:block}
.tile em{font-style:normal;font-size:.8rem;font-weight:600;color:var(--ok)}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bframe .tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bframe .tile{padding:12px;box-shadow:none;border-radius:14px}
.bframe .tile b{font-size:1.5rem}
.bframe .tile span{font-size:.74rem}
.chart{width:100%;height:auto;display:block}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:.93rem}
.feed li:last-child{border-bottom:0}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.76rem;font-weight:600;background:rgba(22,20,15,.07);white-space:nowrap}
.pill.stamp{background:rgba(217,72,15,.11);color:var(--brand-ink)}
.pill.redeem,.pill.ok{background:rgba(37,111,69,.13);color:var(--ok)}
.pill.review,.pill.warn{background:rgba(154,74,7,.13);color:var(--warn)}
.pill.bad{background:rgba(180,35,24,.11);color:var(--bad)}
.poster{width:100%;max-width:320px;border-radius:12px;border:1px solid var(--line);display:block;box-shadow:var(--sh1)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:14px;background:rgba(22,20,15,.06);max-width:100%;width:fit-content}
.tabs button{border:0;background:transparent;padding:10px 15px;min-height:42px;border-radius:10px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--muted);transition:color .2s,background .2s}
.tabs button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.todo{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.todo li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.todo li:last-child{border-bottom:0}
.todo .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);flex:none;display:grid;place-items:center}
.todo li.ok .dot{background:var(--ok);border-color:var(--ok)}
.todo li.ok .dot::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.todo li.ok span.t{color:var(--muted);text-decoration:line-through}
.todo .btn{margin-left:auto}
.bigcode{font:600 2rem/1 var(--mono);letter-spacing:.2em;padding:20px;border-radius:16px;background:var(--ink);color:var(--cream);text-align:center}
.clist{list-style:none;margin:0;padding:0}
.clist li{border-bottom:1px solid var(--line)}
.clist li:last-child{border-bottom:0}
.clist button{width:100%;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left;background:none;border:0;padding:13px 6px;cursor:pointer;border-radius:10px;transition:background .2s}
.clist button:hover{background:rgba(22,20,15,.04)}
.clist .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clist .vs{display:block;font:700 1.2rem/1 var(--display);font-variant-numeric:tabular-nums;text-align:right}
.clist .sub{font-size:.82rem;color:var(--muted);grid-column:1/-1}
.table{width:100%;border-collapse:collapse;font-size:.9rem}
.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.table th{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.scrollx{overflow-x:auto}
.legal h2{font-size:1.4rem;margin:28px 0 8px}
.legal p,.legal li{color:#3a352f;margin-bottom:8px}
.legal ul{padding-left:20px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>

      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/>
