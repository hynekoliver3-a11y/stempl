<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:1200px;height:630px;background:#f5f2ea;font-family:-apple-system,"Segoe UI",Inter,Roboto,Arial,sans-serif;color:#16140f;display:grid;grid-template-columns:1.25fr .75fr;align-items:center;gap:40px;padding:0 70px;box-sizing:border-box;overflow:hidden}
.logo{display:flex;gap:14px;align-items:center;font-weight:800;font-size:44px;letter-spacing:-.03em}
